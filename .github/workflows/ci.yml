name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Tests, certificates, and reproducibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Test
        run: make test
      - name: Reproduce and audit
        run: make audit
